<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Check-in / Check-out</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold mb-6 text-center text-indigo-600">Check-in / Check-out</h2>

    <form class="space-y-6">
      <div>
        <label class="block mb-1 font-semibold">Código QR o ID del Niño</label>
        <input type="text" class="input" placeholder="Escanea o introduce el ID" required>
      </div>

      <div class="flex space-x-4 justify-center">
        <button type="submit" class="btn-primary bg-green-500 hover:bg-green-600">Check-in</button>
        <button type="submit" class="btn-primary bg-red-500 hover:bg-red-600">Check-out</button>
      </div>
    </form>

  </div>

<style>
.input {
  @apply w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-400;
}
.btn-primary {
  @apply mt-2 text-white font-bold py-3 px-8 rounded-xl shadow-md transition;
}
</style>

</body>
</html>
