<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comienza tu Prueba Gratis | KidzCare</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 font-sans leading-normal tracking-normal">

  <!-- Sección HERO -->
  <section class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center relative">
    <div class="absolute top-0 left-0 w-full h-full bg-black opacity-20"></div>

    <div class="relative z-10 text-center px-6 md:px-12">

      <!-- Título -->
      <h1 class="text-4xl md:text-6xl font-extrabold text-white mb-6 animate-fade-in-up">
        Comienza tu Período de Prueba
      </h1>

      <!-- Subtítulo -->
      <p class="text-lg md:text-2xl text-gray-200 mb-10 animate-fade-in-up delay-200">
        Optimiza la gestión de tu centro infantil con la plataforma más confiable y segura.
        ¡Sin tarjeta de crédito y sin compromiso!
      </p>

      <!-- Botón de acción -->
      <a href="registro.html" 
         class="bg-white text-indigo-600 font-bold text-lg py-4 px-10 rounded-full shadow-lg hover:bg-indigo-100 hover:scale-110 transform transition duration-300 animate-bounce inline-block">
        Comenzar Período de Prueba
      </a>

      <!-- Texto adicional -->
      <p class="mt-8 text-sm text-gray-100 opacity-80">
        30 días gratis. Cancela cuando quieras. Sin riesgos.
      </p>

    </div>
  </section>

  <!-- Animaciones CSS -->
  <style>
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up {
      animation: fadeInUp 1s ease-out forwards;
    }
    .delay-200 {
      animation-delay: 0.2s;
    }
  </style>

</body>
</html>
