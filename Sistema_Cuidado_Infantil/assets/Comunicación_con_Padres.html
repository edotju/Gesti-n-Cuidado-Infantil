<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comunicación con Padres</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-3xl bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-500">Enviar Mensaje a Padres</h2>

    <form class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-1 font-semibold">Nombre del Niño</label>
          <input type="text" class="input" placeholder="Nombre del Niño" required>
        </div>
        <div>
          <label class="block mb-1 font-semibold">Nombre del Tutor</label>
          <input type="text" class="input" placeholder="Nombre del Tutor" required>
        </div>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Asunto</label>
        <input type="text" class="input" placeholder="Ej: Actividades del día" required>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Mensaje</label>
        <textarea class="input" placeholder="Escribe el reporte o mensaje diario..." rows="5"></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn-primary">Enviar Mensaje</button>
      </div>
    </form>

  </div>

<style>
.input {
  @apply w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400;
}
.btn-primary {
  @apply mt-4 bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-xl shadow-md transition;
}
</style>

</body>
</html>
