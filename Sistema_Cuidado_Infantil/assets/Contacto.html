<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KidzCare - Contacto</title>
    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f8ff;
            color: #333;
        }

        header {
            background-color: #68c3d4;
            padding: 20px;
            text-align: center;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
        }

        header span {
            color: #fff89a;
        }

        nav {
            background-color: #4eaab9;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffeaa7;
        }

        .section {
            padding: 60px 20px;
            max-width: 1000px;
            margin: auto;
            text-align: center;
        }

        .section h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #222;
        }

        .section p {
            color: #666;
            margin-bottom: 30px;
        }

        /* FORMULARIO DE CONTACTO */
        .contact-form {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 15px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            resize: none;
            transition: border 0.3s;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            border-color: #68c3d4;
        }

        .contact-form button {
            padding: 12px;
            background-color: #68c3d4;
            color: white;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .contact-form button:hover {
            background-color: #4eaab9;
        }

        footer {
            background-color: #68c3d4;
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 50px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 10px;
            }

            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Kidz<span>Care</span></h1>
    </header>

    <nav>
        <a href="#inicio">Inicio</a>
        <a href="index.html"></a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
    </nav>

    <!-- SECCIÓN CONTACTO -->
    <section class="section contacto" id="contacto">
        <h2>Contáctanos</h2>
        <p>¿Tienes preguntas o deseas más información? ¡Escríbenos!</p>

        <form class="contact-form" action="https://formsubmit.co/tucorreo@ejemplo.com" method="POST">
            <input type="text" name="nombre" placeholder="Tu nombre" required>
            <input type="email" name="email" placeholder="Tu correo" required>
            <textarea name="mensaje" rows="6" placeholder="Tu mensaje" required></textarea>
            <button type="submit">Enviar</button>
        </form>
    </section>

    <footer>
        © 2025 KidzCare. Todos los derechos reservados.
    </footer>

</body>
</html>
