<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear Evento</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-purple-50 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold mb-6 text-center text-purple-600">Nuevo Evento en Calendario</h2>

    <form class="space-y-6">
      <div>
        <label class="block mb-1 font-semibold">Título del Evento</label>
        <input type="text" class="input" placeholder="Ej: Fiesta de primavera" required>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1 font-semibold">Fecha del Evento</label>
          <input type="date" class="input" required>
        </div>
        <div>
          <label class="block mb-1 font-semibold">Hora</label>
          <input type="time" class="input" required>
        </div>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Descripción</label>
        <textarea class="input" placeholder="Detalles del evento..." rows="4"></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn-primary">Crear Evento</button>
      </div>
    </form>

  </div>

<style>
.input {
  @apply w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-400;
}
.btn-primary {
  @apply mt-4 bg-purple-500 hover:bg-purple-600 text-white font-bold py-3 px-8 rounded-xl shadow-md transition;
}
</style>

</body>
</html>
