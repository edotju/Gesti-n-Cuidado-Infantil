<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguimiento de Actividades</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-4xl bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-bold mb-6 text-center text-green-600">Seguimiento Diario</h2>

    <form class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block mb-1 font-semibold">Nombre del Niño</label>
          <input type="text" class="input" placeholder="Nombre del Niño" required>
        </div>
        <div>
          <label class="block mb-1 font-semibold">Fecha</label>
          <input type="date" class="input" required>
        </div>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Comidas</label>
        <textarea class="input" placeholder="Desayuno, almuerzo, snack..." rows="2"></textarea>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Juegos y Aprendizaje</label>
        <textarea class="input" placeholder="Actividades realizadas, progreso..." rows="3"></textarea>
      </div>

      <div>
        <label class="block mb-1 font-semibold">Observaciones Médicas o Emocionales</label>
        <textarea class="input" placeholder="Notas sobre salud o comportamiento..." rows="3"></textarea>
      </div>

      <div class="text-center">
        <button type="submit" class="btn-primary">Guardar Registro</button>
      </div>
    </form>

  </div>

<style>
.input {
  @apply w-full p-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400;
}
.btn-primary {
  @apply mt-4 bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-xl shadow-md transition;
}
</style>

</body>
</html>
